name: syncash-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-node-service: &node-service
  image: syncash-api:${RELEASE_SHA:?Set RELEASE_SHA}
  env_file:
    - ${SYNCASH_ENV_FILE:-/opt/syncash/shared/env/.env.production}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  user: node
  logging: *default-logging
  volumes:
    - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:?Set GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH}:/run/secrets/google-application-credentials.json:ro
  environment:
    NODE_ENV: production
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-application-credentials.json
  networks:
    - internal
    - edge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    mem_limit: 4g
    cpus: 2.0
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    mem_limit: 1g
    cpus: 0.75
    networks:
      - internal

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    mem_limit: 4g
    cpus: 2.0
    networks:
      - internal

  api:
    <<: *node-service
    build:
      context: .
      dockerfile: Dockerfile.production
      target: api
    ports:
      - "127.0.0.1:3181:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0

  worker:
    <<: *node-service
    command: ["node", "dist-server/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').stat('/tmp/syncash-worker-heartbeat',(e,s)=>process.exit(e||Date.now()-s.mtimeMs>90000?1:0))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    mem_limit: 2g
    cpus: 1.5

  frontend:
    image: syncash-frontend:${RELEASE_SHA:?Set RELEASE_SHA}
    build:
      context: .
      dockerfile: Dockerfile.production
      target: frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Set VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Set VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Set VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?Set VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?Set VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Set VITE_FIREBASE_APP_ID}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3180:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge

  migrate:
    image: syncash-api:${RELEASE_SHA:?Set RELEASE_SHA}
    profiles: ["tools"]
    env_file:
      - ${SYNCASH_ENV_FILE:-/opt/syncash/shared/env/.env.production}
    command: ["node", "dist-server/src/db/migrate.js"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    user: node
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal

networks:
  internal:
    name: syncash-prod-internal
    internal: true
  edge:
    name: syncash-prod-edge

volumes:
  postgres-data:
    name: syncash-prod-postgres-data
  redis-data:
    name: syncash-prod-redis-data
  minio-data:
    name: syncash-prod-minio-data
