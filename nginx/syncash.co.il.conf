# syncash.co.il + www — האתר הציבורי (סטטי) של SynCash.
# מותקן על ה-nginx של המארח ב-/etc/nginx/sites-available/syncash.co.il.conf (+ symlink ל-sites-enabled).
# דורש: (1) רשומות A של syncash.co.il ו-www.syncash.co.il שמצביעות לשרת הזה,
#        (2) תעודת Let's Encrypt: certbot certonly --webroot -w /var/www/certbot -d syncash.co.il -d www.syncash.co.il
# הותקן בייצור ב-26.9.2026 (זהה לקובץ ב-/etc/nginx/sites-available/syncash.co.il.conf).
# האפליקציה (app.syncash.co.il) לא נוגעת בקובץ הזה ולא מושפעת ממנו.

server {
    listen 80;
    listen [::]:80;
    server_name syncash.co.il www.syncash.co.il;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://syncash.co.il$request_uri;
    }
}

# www -> apex (כתובת קנונית אחת)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.syncash.co.il;

    ssl_certificate /etc/letsencrypt/live/syncash.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncash.co.il/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    return 301 https://syncash.co.il$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name syncash.co.il;

    ssl_certificate /etc/letsencrypt/live/syncash.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncash.co.il/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # אין סקריפטים/פונטים/תמונות מצד שלישי באתר הציבורי; JSON-LD אינו סקריפט מבוצע ולכן אינו נחסם.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # שלושת ה-endpoints הציבוריים בלבד שהאתר צריך. ה-Origin מוסר כדי שה-API (allowlist של האפליקציה)
    # יטפל בבקשה כבקשה ללא Origin; אין cookies ואין credentials בבקשות האלה.
    location = /api/public/site-settings {
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_read_timeout 15s;
    }

    location ~ ^/api/legal-documents/(TERMS|PRIVACY|DPA)$ {
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_read_timeout 15s;
    }

    location = /api/privacy-requests {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_read_timeout 15s;
    }

    # כל שאר ה-API אינו נגיש מהדומיין הציבורי
    location /api/ {
        return 404;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3182/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }
}
