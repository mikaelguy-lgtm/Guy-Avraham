server {
    listen 80;
    listen [::]:80;
    server_name app.syncash.co.il;

    server_tokens off;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.syncash.co.il;

    ssl_certificate /etc/letsencrypt/live/app.syncash.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.syncash.co.il/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        return 503 '<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynCash — המערכת בהכנה</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07101f;color:#f8fafc;font-family:Arial,sans-serif}.card{max-width:620px;margin:24px;padding:48px;border:1px solid #24334d;border-radius:24px;background:#0d1729;text-align:center;box-shadow:0 24px 70px #0006}h1{margin:0 0 16px;color:#d4af37;font-size:clamp(2rem,6vw,3.4rem)}p{margin:0;color:#cbd5e1;font-size:1.2rem;line-height:1.8}</style></head><body><main class="card"><h1>SynCash</h1><p>המערכת בהכנה ותעלה בקרוב</p></main></body></html>';
    }
}
